# Nginx Configuration Template for Hostinger VPS
# Save to: /etc/nginx/sites-available/api.yourdomain.com
# Then link: ln -s /etc/nginx/sites-available/api.yourdomain.com /etc/nginx/sites-enabled/
# Then run: sudo nginx -t && sudo systemctl reload nginx
# For SSL: sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 100M;

    # Static uploads caching
    location /uploads/ {
        alias /var/www/solvex-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API Proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
